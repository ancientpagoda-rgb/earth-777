<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02060b">
<title>Earth 777 Lite</title>
<style>

<body>
<div id="stage"></div>
<div id="reticle"></div>
<section id="hud" class="panel">
  <div class="title"><span>EARTH 777 LITE</span><span class="badge">COARSE LIVING EARTH</span></div>
  <div class="readouts">
    <div class="readout"><b id="year">777,000 BP</b><span>year</span></div>
    <div class="readout"><b id="temperature">—</b><span>mean temp</span></div>
    <div class="readout"><b id="sea">—</b><span>sea level</span></div>
    <div class="readout"><b id="green">—</b><span>land green</span></div>
  </div>
  <div class="row">
    <button id="play">Ⅱ</button>
    <button class="speed on" data-speed="1">1×</button>
    <button class="speed" data-speed="10">10×</button>
    <button class="speed" data-speed="100">100×</button>
    <button class="speed" data-speed="1000">1K×</button>
    <button id="mode" class="grow">DESCEND</button>
  </div>
  <div class="row">
    <button id="reset">RESET VIEW</button>
    <button id="branch">NEW EARTH</button>
    <button id="spin" class="globe-only">AUTO ROTATE</button>
    <span id="place" class="dim surface-only"></span>
  </div>
  <div id="status">loading compact Earth…</div>
  <div class="note">Real ETOPO terrain · simplified climate, water, ice and vegetation · constant-cost time acceleration</div>
</section>
<div id="hint">drag · wheel/pinch · descend at reticle</div>
<script type="module">
const $=id=>document.getElementById(id),status=$('status');

  const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
  const stage=$('stage'),scene=new THREE.Scene();scene.background=new THREE.Color(0x010307);
  const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,100);camera.position.set(0,.12,3.25);
  const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setPixelRatio(Math.min(1.25,devicePixelRatio));stage.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0x29445c,.22));const sun=new THREE.DirectionalLight(0xffffff,2.15);sun.position.set(4,2,5);scene.add(sun);

  const payload=terrainText.match(/const ELEVATION_BASE64 = "([A-Za-z0-9+/=]+)"/);if(!payload)throw Error('terrain payload missing');

  const mapColor=new THREE.Color();function updateMapTexture(){for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){const k=y*SW+x,p=k*4;cellColor(cellElevation[k],k,mapColor);pixels[p]=mapColor.r*255;pixels[p+1]=mapColor.g*255;pixels[p+2]=mapColor.b*255;pixels[p+3]=255}mapCtx.putImageData(mapImage,0,0);worldTexture.needsUpdate=true}
  const worldTexture=new THREE.CanvasTexture(map);worldTexture.colorSpace=THREE.SRGBColorSpace;worldTexture.minFilter=THREE.LinearFilter;worldTexture.magFilter=THREE.LinearFilter;
  const globeRoot=new THREE.Group(),RESET_Q=new THREE.Quaternion().setFromEuler(new THREE.Euler(-.08,-.45,0,'XYZ'));globeRoot.quaternion.copy(RESET_Q);scene.add(globeRoot);
  const FY=6356.752314245/6378.137,earth=new THREE.Mesh(new THREE.SphereGeometry(1,72,36).scale(1,FY,1),new THREE.MeshLambertMaterial({map:worldTexture}));globeRoot.add(earth);

  {let s=1234567;const rnd=()=>((s=Math.imul(1664525,s)+1013904223)>>>0)/4294967296,n=650,p=new Float32Array(n*3);for(let i=0;i<n;i++){const z=rnd()*2-1,a=rnd()*Math.PI*2,r=13+rnd()*22,q=Math.sqrt(1-z*z);p[i*3]=r*q*Math.cos(a);p[i*3+1]=r*z;p[i*3+2]=r*q*Math.sin(a)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xb9c9d2,size:.024,transparent:true,opacity:.65})))}

  const waterGeom=new THREE.BufferGeometry();waterGeom.setAttribute('position',new THREE.BufferAttribute(waterPositions,3));waterGeom.setIndex(indices);const waterMesh=new THREE.Mesh(waterGeom,new THREE.MeshPhongMaterial({color:0x2b91b0,transparent:true,opacity:.62,shininess:70,depthWrite:false,side:THREE.DoubleSide}));waterMesh.renderOrder=2;surfaceGroup.add(waterMesh);
  const lineGeom=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-6,-.01,0),new THREE.Vector3(6,-.01,0)]);const horizonLine=new THREE.Line(lineGeom,new THREE.LineBasicMaterial({color:0x8dc7d2,transparent:true,opacity:.13}));surfaceGroup.add(horizonLine);
  let mode='globe',surfaceLat=0,surfaceLon=0,surfaceSpanKm=620,surfaceDirty=true;
  function rebuildSurface(){if(mode!=='surface')return;const scale=12/surfaceSpanKm,heightScale=.00034*Math.sqrt(620/surfaceSpanKm),cosLat=Math.max(.12,Math.cos(surfaceLat*Math.PI/180));for(let gy=0;gy<=GRID;gy++)for(let gx=0;gx<=GRID;gx++){const k=gy*(GRID+1)+gx,p=k*3,dx=(gx/GRID-.5)*surfaceSpanKm,dz=(gy/GRID-.5)*surfaceSpanKm,lat=clamp(surfaceLat-dz/111,-89.5,89.5),lon=wrapLon(surfaceLon+dx/(111*cosLat)),z=terrainAt(lat,lon),si=stateIndex(lat,lon),wx=dx*scale,wz=dz*scale,curve=-(dx*dx+dz*dz)/(2*6371)*scale,wy=curve+(z-seaLevel)*heightScale;positions[p]=wx;positions[p+1]=wy;positions[p+2]=wz;cellColor(z,si,mapColor);colors[p]=mapColor.r;colors[p+1]=mapColor.g;colors[p+2]=mapColor.b;waterPositions[p]=wx;waterPositions[p+1]=curve+.006;waterPositions[p+2]=wz}surfaceGeom.attributes.position.needsUpdate=true;surfaceGeom.attributes.color.needsUpdate=true;surfaceGeom.computeVertexNormals();waterGeom.attributes.position.needsUpdate=true;waterGeom.computeVertexNormals();waterMesh.visible=true;surfaceDirty=false;$('place').textContent=`${Math.abs(surfaceLat).toFixed(1)}°${surfaceLat>=0?'N':'S'}  ${Math.abs(surfaceLon).toFixed(1)}°${surfaceLon>=0?'E':'W'} · ${Math.round(surfaceSpanKm)} km`}
  const ray=new THREE.Raycaster(),centerNdc=new THREE.Vector2();function centerLatLon(){scene.updateMatrixWorld(true);ray.setFromCamera(centerNdc,camera);const hit=ray.intersectObject(earth,false)[0];if(!hit)return{lat:0,lon:0};const p=globeRoot.worldToLocal(hit.point.clone()),rr=Math.hypot(p.x,p.z);return{lat:Math.atan2(p.y/FY,rr)*180/Math.PI,lon:Math.atan2(-p.z,p.x)*180/Math.PI}}
  const savedCamera=new THREE.Vector3(),savedQuaternion=new THREE.Quaternion();function enterSurface(){const ll=centerLatLon();surfaceLat=ll.lat;surfaceLon=ll.lon;savedCamera.copy(camera.position);savedQuaternion.copy(camera.quaternion);mode='surface';document.body.classList.add('surface');globeRoot.visible=false;surfaceGroup.visible=true;camera.position.set(0,4.25,6.8);camera.lookAt(0,-.25,0);surfaceDirty=true;rebuildSurface();$('mode').textContent='RETURN TO GLOBE';$('hint').textContent='drag to travel · wheel/pinch changes scale'}function exitSurface(){mode='globe';document.body.classList.remove('surface');surfaceGroup.visible=false;globeRoot.visible=true;camera.position.copy(savedCamera);camera.quaternion.copy(savedQuaternion);$('mode').textContent='DESCEND';$('hint').textContent='drag · wheel/pinch · descend at reticle'}
  function refreshWorld(force=false){updateMapTexture();if(mode==='surface'){surfaceDirty=true;if(force)rebuildSurface()}updateHud()}
  function updateHud(){const year=777000-elapsed;$('year').textContent=year>0?`${Math.round(year).toLocaleString()} BP`:`${Math.abs(Math.round(year)).toLocaleString()} future`;$('temperature').textContent=`${meanTemp>=0?'+':''}${meanTemp.toFixed(1)}°C`;$('sea').textContent=`${seaLevel>=0?'+':''}${seaLevel.toFixed(0)} m`;$('green').textContent=`${Math.round(greenLand*100)}%`}

  function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)}addEventListener('resize',resize);resize();
