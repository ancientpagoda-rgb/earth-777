<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02060b">
<link rel="icon" href="data:,">
<title>Earth 777 Lite</title>
<link rel="stylesheet" href="./lite.css">
</head>
<body>
<div id="stage"></div>
<div id="reticle"></div>
<section id="hud" class="panel">
  <div class="title"><span>EARTH 777 LITE</span><span id="quality" class="badge">ADAPTIVE · STARTING</span></div>
  <div class="readouts">
    <div class="readout"><b id="year">777,000 BP</b><span>year</span></div>
    <div class="readout"><b id="temperature">—</b><span>mean temp</span></div>
    <div class="readout"><b id="sea">—</b><span>sea level</span></div>
    <div class="readout"><b id="green">—</b><span>biosphere</span></div>
  </div>
  <div class="row" id="layers">
    <button class="layer on" data-layer="terrain">LIVING</button>
    <button class="layer" data-layer="temperature">TEMP</button>
    <button class="layer" data-layer="moisture">WATER</button>
    <button class="layer" data-layer="vegetation">PLANTS</button>
    <button class="layer" data-layer="ice">ICE</button>
  </div>
  <svg id="history" viewBox="0 0 320 57" preserveAspectRatio="none" aria-label="Planet history">
    <path class="grid" d="M0 14H320M0 28H320M0 42H320"/>
    <polyline id="history-temp" class="temp" points=""/>
    <polyline id="history-sea" class="sea" points=""/>
    <polyline id="history-veg" class="veg" points=""/>
  </svg>
  <div class="legend"><span><i class="t"></i>temperature</span><span><i class="s"></i>sea</span><span><i class="v"></i>vegetation</span></div>
  <div class="row">
    <button id="play">Ⅱ</button>
    <button class="speed on" data-speed="1">1×</button>
    <button class="speed" data-speed="10">10×</button>
    <button class="speed" data-speed="100">100×</button>
    <button class="speed" data-speed="1000">1K×</button>
    <button id="mode" class="grow">DESCEND</button>
  </div>
  <div class="row">
    <button id="reset">RESET VIEW</button>
    <button id="branch">NEW EARTH</button>
    <button id="share">SHARE</button>
    <button id="spin" class="globe-only">AUTO ROTATE</button>
    <span id="place" class="dim surface-only"></span>
  </div>
  <div id="status">loading compact Earth…</div>
  <div class="note">Real ETOPO + evolving relief · dynamic rivers · responsive biomes · lightweight fauna</div>
</section>
<div id="hint">drag · click a place · wheel/pinch · descend</div>
<script type="module" src="./app-loader.js"></script>
</body>
</html>
