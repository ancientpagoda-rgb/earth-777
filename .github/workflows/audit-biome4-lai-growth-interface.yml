name: Audit BIOME4 LAI and growth interface

on:
  push:
    branches:
      - agent/biome4-pft-hydrology-coupling

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-pft-hydrology-coupling
      - name: Print findnpp and growth hydrology setup
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors 'https://pmip2.lsce.ipsl.fr/share/synth/biome4/biome41.tar.gz' -o /tmp/biome41.tar.gz
          mkdir -p /tmp/biome4 && tar -xzf /tmp/biome41.tar.gz -C /tmp/biome4
          python3 - <<'PY'
          from pathlib import Path
          p=next(Path('/tmp/biome4').rglob('biome4.f'))
          lines=p.read_text(errors='ignore').splitlines()
          for lo,hi,label in [
              (1218,1375,'findnpp optimizer'),
              (1280,1450,'growth setup through hydrology call'),
              (2160,2500,'hydrology demand and water stress')
          ]:
              print(f'\n=== {label}: lines {lo+1}-{hi} ===')
              for n in range(lo,min(hi,len(lines))): print(f'{n+1:5d}: {lines[n]}')
          PY
      - name: Remove transient workflow
        run: |
          rm .github/workflows/audit-biome4-lai-growth-interface.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove transient LAI/growth interface audit'
          git push origin HEAD:agent/biome4-pft-hydrology-coupling
