name: Inspect Krapp forcing inputs

on:
  push:
    branches:
      - agent/krapp-777-climate

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/krapp-777-climate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install netCDF4 scipy pandas
      - name: Download and inspect original forcing inputs
        run: |
          curl -L --fail --retry 3 https://osf.io/download/d74wc/ -o /tmp/inputs.tar.gz
          echo '06adb8c8b4f9b1cffcb8bc8d25759924ce1b69a1252d905d28a1a95192b08786  /tmp/inputs.tar.gz' | sha256sum -c -
          echo '=== INPUT FILES OF INTEREST ==='
          tar -tzf /tmp/inputs.tar.gz | grep -Ei 'orb|co2|bereiter|antarctica|ice|mask|split' | head -n 300
          mkdir -p /tmp/inputs
          tar -xzf /tmp/inputs.tar.gz -C /tmp/inputs
          echo '=== MATCHING FILES ==='
          find /tmp/inputs -type f | grep -Ei 'orb|co2|bereiter|antarctica|ice|mask|split' | head -n 300
          echo '=== SMALL TEXT/CSV HEADS ==='
          while IFS= read -r f; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 5000000 ]; then
              echo "--- $f ($size bytes) ---"
              case "$f" in
                *.txt|*.csv|*.dat) head -n 30 "$f" || true ;;
              esac
            fi
          done < <(find /tmp/inputs -type f | grep -Ei 'orb|co2|bereiter|antarctica|split')
      - name: Inspect a published coefficient file
        run: |
          curl -L --fail --retry 3 https://osf.io/download/bkuh4/ -o /tmp/coeff.nc
          echo '08d857b2d7c48e19df72565bfb558822645ebda2cfe1ea460b9e92edfbb8e1c3  /tmp/coeff.nc' | sha256sum -c -
          python - <<'PY'
          import netCDF4 as nc
          import numpy as np
          p='/tmp/coeff.nc'
          ds=nc.Dataset(p)
          print('DIMENSIONS', {k: len(v) for k,v in ds.dimensions.items()})
          for name,v in ds.variables.items():
              print('VAR', name, v.dimensions, v.shape, v.dtype)
              print(' ATTRS', {a:getattr(v,a) for a in v.ncattrs()})
              if v.size <= 150:
                  print(' VALUES', np.asarray(v[:]).tolist())
              elif name in ['lat','latitude','lon','longitude','time','all_params','temp_mean','coeff_co2','coeff_obl','coeff_ecospre','coeff_esinpre']:
                  arr=np.asarray(v[:])
                  finite=arr[np.isfinite(arr)]
                  print(' RANGE', float(finite.min()) if finite.size else None, float(finite.max()) if finite.size else None)
                  print(' SAMPLE', arr.reshape(-1)[:12].tolist())
          print('GLOBAL', {a:getattr(ds,a) for a in ds.ncattrs()})
          PY
