name: Probe Krapp OSF data

on:
  push:
    branches:
      - agent/krapp-777-climate

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/krapp-777-climate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-krapp-osf.mjs
