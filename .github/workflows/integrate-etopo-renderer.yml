name: Integrate ETOPO terrain renderer

on:
  push:
    branches:
      - agent/etopo-2022-terrain

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etopo-2022-terrain

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: python3 scripts/apply-etopo-renderer-patch.py
      - run: npm test
      - run: npm run build

      - name: Commit renderer integration
        run: |
          rm .github/workflows/integrate-etopo-renderer.yml scripts/apply-etopo-renderer-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ingest-etopo-2022.mjs src/render/earth-view.js test/terrain-layer.test.js .github/workflows/integrate-etopo-renderer.yml scripts/apply-etopo-renderer-patch.py
          git commit -m "Render Earth 777 from ETOPO 2022 bedrock"
          git push origin HEAD:agent/etopo-2022-terrain
