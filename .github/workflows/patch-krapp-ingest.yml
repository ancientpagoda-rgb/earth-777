name: Patch Krapp ingest sentinel handling

on:
  push:
    branches:
      - agent/krapp-777-climate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/krapp-777-climate
      - run: python3 scripts/patch-krapp-ingest.py
      - name: Commit patch
        run: |
          rm .github/workflows/patch-krapp-ingest.yml scripts/patch-krapp-ingest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ingest-krapp-777.py .github/workflows/patch-krapp-ingest.yml scripts/patch-krapp-ingest.py
          git commit -m "Handle CDO missing sentinels in Krapp fields"
          git push origin HEAD:agent/krapp-777-climate
