name: Apply Earth 777 performance pass

on:
  push:
    branches: [agent/performance-architecture]

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/performance-architecture
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply performance patch
        run: python3 .github/scripts/apply-performance-pass.py

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit clean result
        run: |
          rm .github/scripts/apply-performance-pass.py
          rm .github/workflows/apply-performance-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize interactive rendering performance"
          git push origin HEAD:agent/performance-architecture
