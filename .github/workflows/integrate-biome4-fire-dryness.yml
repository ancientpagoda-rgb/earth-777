name: Integrate BIOME4 fire dryness diagnostics

on:
  push:
    branches:
      - agent/biome4-fire-dryness
    paths:
      - scripts/integrate-biome4-fire-dryness.py
      - .github/workflows/integrate-biome4-fire-dryness.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-fire-dryness
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 scripts/integrate-biome4-fire-dryness.py
      - run: npm test
      - run: npm run build
      - name: Commit integrated diagnostics and remove one-time helpers
        run: |
          rm -f scripts/integrate-biome4-fire-dryness.py
          rm -f .github/workflows/integrate-biome4-fire-dryness.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate BIOME4 fire and dryness diagnostics'
          git push origin HEAD:agent/biome4-fire-dryness
