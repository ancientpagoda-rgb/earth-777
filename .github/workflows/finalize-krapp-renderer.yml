name: Finalize Krapp globe climate wiring

on:
  push:
    branches:
      - agent/krapp-777-climate

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/krapp-777-climate

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: python3 scripts/finalize-krapp-renderer.py
      - run: npm test
      - run: npm run build

      - name: Commit final renderer wiring
        run: |
          rm .github/workflows/finalize-krapp-renderer.yml scripts/finalize-krapp-renderer.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish Krapp globe climate integration"
          git push origin HEAD:agent/krapp-777-climate
