name: Audit exact BIOME4 fire and ranking rules

on:
  push:
    branches:
      - agent/biome4-fire-dryness
    paths:
      - .github/workflows/audit-biome4-fire-exact.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-fire-dryness
      - name: Print exact source ranges
        run: |
          curl -fsSL 'https://pmip2.lsce.ipsl.fr/share/synth/biome4/biome41.tar.gz' -o /tmp/b.tgz
          mkdir -p /tmp/b && tar -xzf /tmp/b.tgz -C /tmp/b
          f=$(find /tmp/b -name biome4.f | head -1)
          echo '=== PFT selection/ranking 360-700 ==='
          sed -n '360,700p' "$f"
          echo '=== exact fire routine ==='
          sed -n '3518,3590p' "$f"
          echo '=== wet array assignments ==='
          grep -n -C 5 -E 'wet\(day\)|wet\(' "$f" | head -220
      - name: Remove transient workflow
        run: |
          rm -f .github/workflows/audit-biome4-fire-exact.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove transient BIOME4 exact-fire audit'
          git push origin HEAD:agent/biome4-fire-dryness
