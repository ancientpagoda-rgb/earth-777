name: Inspect Krapp reconstruction code

on:
  push:
    branches:
      - agent/krapp-777-climate

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/krapp-777-climate
      - name: Download original authors code
        run: |
          curl -L --fail --retry 3 https://osf.io/download/njxvs/ -o /tmp/README.md
          curl -L --fail --retry 3 https://osf.io/download/5ry4c/ -o /tmp/code.tar.gz
          echo '=== README ==='
          cat /tmp/README.md
          echo '=== ARCHIVE ==='
          tar -tzf /tmp/code.tar.gz
          mkdir -p /tmp/krapp-code
          tar -xzf /tmp/code.tar.gz -C /tmp/krapp-code
          echo '=== RECONSTRUCTION REFERENCES ==='
          grep -RniE 'regress|coef|predict|temp|prec|tcc|ecc|obl|precess|CO2|time' /tmp/krapp-code | head -n 1000
