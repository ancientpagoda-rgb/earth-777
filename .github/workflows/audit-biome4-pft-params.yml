name: Audit BIOME4 PFT parameters

on:
  push:
    branches:
      - agent/biome4-pft-climate-eligibility

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-pft-climate-eligibility
      - name: Inspect BIOME4 PFT parameter tables and climate eligibility
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors \
            'https://pmip2.lsce.ipsl.fr/share/synth/biome4/biome41.tar.gz' \
            -o /tmp/biome41.tar.gz
          mkdir -p /tmp/biome4
          tar -xzf /tmp/biome41.tar.gz -C /tmp/biome4
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/biome4')
          keys=(
            'gdd', 'tcmin', 'tcmax', 'twmin', 'twmax', 'pft', 'bioclim',
            'evergreen', 'deciduous', 'grass', 'c3', 'c4', 'tropical',
            'boreal', 'temperate', 'coldest', 'warmest'
          )
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p.suffix.lower() not in {'.f','.for','.f90','.inc','.dat','.txt'}:
                  continue
              lines=p.read_text(errors='ignore').splitlines()
              hits=[]
              for i,line in enumerate(lines):
                  low=line.lower()
                  if any(k in low for k in keys): hits.append(i)
              if not hits: continue
              print(f'\n=== {p.relative_to(root)} ===')
              ranges=[]
              for i in hits:
                  lo=max(0,i-8); hi=min(len(lines),i+14)
                  if ranges and lo <= ranges[-1][1]+1:
                      ranges[-1]=(ranges[-1][0], max(ranges[-1][1],hi))
                  else:
                      ranges.append((lo,hi))
              for lo,hi in ranges:
                  print(f'--- lines {lo+1}-{hi} ---')
                  for n in range(lo,hi): print(f'{n+1:5d}: {lines[n]}')
          PY
      - name: Remove transient workflow
        run: |
          rm .github/workflows/audit-biome4-pft-params.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove transient BIOME4 PFT parameter audit'
          git push origin HEAD:agent/biome4-pft-climate-eligibility
