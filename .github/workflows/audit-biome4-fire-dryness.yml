name: Audit BIOME4 fire and dryness diagnostics

on:
  push:
    branches:
      - agent/biome4-fire-dryness
    paths:
      - .github/workflows/audit-biome4-fire-dryness.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-fire-dryness
      - name: Inspect fire dryness and biome ranking source
        run: |
          curl -fsSL 'https://pmip2.lsce.ipsl.fr/share/synth/biome4/biome41.tar.gz' -o /tmp/b.tgz
          mkdir -p /tmp/b && tar -xzf /tmp/b.tgz -C /tmp/b
          f=$(find /tmp/b -name biome4.f | head -1)
          echo '=== fire/dryness symbols ==='
          grep -n -E 'fire|dry|greenday|sumoff|wilt|annaet|annp|runoff|desert|biome|classif' "$f" | head -520
          echo '=== classification section 700-1100 ==='
          sed -n '700,1100p' "$f"
          echo '=== growth outputs 1550-1810 ==='
          sed -n '1550,1810p' "$f"
      - name: Remove transient workflow
        run: |
          rm -f .github/workflows/audit-biome4-fire-dryness.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove transient BIOME4 fire-dryness audit'
          git push origin HEAD:agent/biome4-fire-dryness
