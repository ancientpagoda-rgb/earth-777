name: Audit BIOME4 demand constants

on:
  push:
    branches:
      - agent/biome4-vpd-transpiration
    paths:
      - .github/workflows/audit-biome4-demand-constants.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-vpd-transpiration
      - name: Print constants and lookup table
        run: |
          curl -fsSL 'https://pmip2.lsce.ipsl.fr/share/synth/biome4/biome41.tar.gz' -o /tmp/b.tgz
          mkdir -p /tmp/b && tar -xzf /tmp/b.tgz -C /tmp/b
          f=$(find /tmp/b -name biome4.f | head -1)
          echo '=== hydrology constants 2220-2305 ==='
          sed -n '2220,2305p' "$f"
          echo '=== table location ==='
          grep -n -i 'subroutine  *table' "$f" | head -5
          line=$(grep -n -i 'subroutine  *table' "$f" | head -1 | cut -d: -f1 || true)
          if [ -n "$line" ]; then sed -n "${line},$((line+180))p" "$f"; fi
      - name: Remove transient workflow
        run: |
          rm -f .github/workflows/audit-biome4-demand-constants.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove transient BIOME4 demand-constant audit'
          git push origin HEAD:agent/biome4-vpd-transpiration
