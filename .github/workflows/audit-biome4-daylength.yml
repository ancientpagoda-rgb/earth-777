name: Audit BIOME4 daylength

on:
  push:
    branches:
      - agent/biome4-pft-water-phenology

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-pft-water-phenology
      - name: Print daylength calculation
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors 'https://pmip2.lsce.ipsl.fr/share/synth/biome4/biome41.tar.gz' -o /tmp/biome41.tar.gz
          mkdir -p /tmp/biome4 && tar -xzf /tmp/biome41.tar.gz -C /tmp/biome4
          python3 - <<'PY'
          from pathlib import Path
          p=next(Path('/tmp/biome4').rglob('biome4.f'))
          lines=p.read_text(errors='ignore').splitlines()
          hits=[]
          for i,line in enumerate(lines):
              if 'ddayl' in line.lower() or 'dayl(' in line.lower() or 'daylength' in line.lower(): hits.append(i)
          ranges=[]
          for i in hits:
              lo=max(0,i-18); hi=min(len(lines),i+28)
              if ranges and lo <= ranges[-1][1]+1: ranges[-1]=(ranges[-1][0],max(ranges[-1][1],hi))
              else: ranges.append((lo,hi))
          for lo,hi in ranges:
              print(f'--- lines {lo+1}-{hi} ---')
              for n in range(lo,hi): print(f'{n+1:5d}: {lines[n]}')
          PY
      - name: Remove transient workflow
        run: |
          rm .github/workflows/audit-biome4-daylength.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove transient BIOME4 daylength audit'
          git push origin HEAD:agent/biome4-pft-water-phenology
