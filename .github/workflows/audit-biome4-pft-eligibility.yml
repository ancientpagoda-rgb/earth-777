name: Audit BIOME4 PFT eligibility

on:
  push:
    branches:
      - agent/biome4-pft-eligibility

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact official BIOME4 PFT tables and eligibility rules
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors \
            'https://pmip2.lsce.ipsl.fr/share/synth/biome4/biome41.tar.gz' \
            -o /tmp/biome41.tar.gz
          mkdir -p /tmp/biome4
          tar -xzf /tmp/biome41.tar.gz -C /tmp/biome4
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/biome4/biome4.f')
          lines=p.read_text(errors='ignore').splitlines()
          starts=[]
          for i,line in enumerate(lines):
              low=line.lower().strip()
              if low.startswith('subroutine pftdata') or low.startswith('subroutine constraints'):
                  starts.append((i,low))
          for start,name in starts:
              end=len(lines)
              for j in range(start+1,len(lines)):
                  low=lines[j].lower().strip()
                  if low.startswith('subroutine ') or low.startswith('function '):
                      end=j
                      break
              print(f'=== {name} lines {start+1}-{end} ===')
              for n in range(start,end):
                  print(f'{n+1:5d}: {lines[n]}')
          PY
