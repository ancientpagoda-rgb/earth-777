name: Audit BIOME4 PFT eligibility

on:
  push:
    branches:
      - agent/biome4-pft-eligibility

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact BIOME4 climate-index routines
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors \
            'https://pmip2.lsce.ipsl.fr/share/synth/biome4/biome41.tar.gz' \
            -o /tmp/biome41.tar.gz
          mkdir -p /tmp/biome4
          tar -xzf /tmp/biome41.tar.gz -C /tmp/biome4
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/biome4/biome4.f')
          lines=p.read_text(errors='ignore').splitlines()
          wanted=('subroutine climdata','subroutine daily','subroutine snow')
          for i,line in enumerate(lines):
              low=line.lower().strip()
              if not any(low.startswith(name) for name in wanted):
                  continue
              end=len(lines)
              for j in range(i+1,len(lines)):
                  nxt=lines[j].lower().strip()
                  if nxt.startswith('subroutine ') or nxt.startswith('function '):
                      end=j
                      break
              print(f'=== {low} lines {i+1}-{end} ===')
              for n in range(i,end): print(f'{n+1:5d}: {lines[n]}')
          PY
