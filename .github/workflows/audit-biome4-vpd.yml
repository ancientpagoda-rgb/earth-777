name: Audit BIOME4 atmospheric demand

on:
  push:
    branches:
      - agent/biome4-vpd-transpiration
    paths:
      - .github/workflows/audit-biome4-vpd.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-vpd-transpiration
      - name: Inspect BIOME4 source equations
        run: |
          curl -fsSL 'https://pmip2.lsce.ipsl.fr/share/synth/biome4/biome41.tar.gz' -o /tmp/biome41.tgz
          mkdir -p /tmp/biome4
          tar -xzf /tmp/biome41.tgz -C /tmp/biome4
          f=$(find /tmp/biome4 -name biome4.f | head -1)
          echo '=== symbols ==='
          grep -n -E 'vpd|vap|humid|emax|gopt|gmin|conduct|evap|ppeett|pet|transp|eet|saturation|esat|psych|delta' "$f" | head -260
          echo '=== ppeett block ==='
          start=$(grep -n -i 'subroutine ppeett' "$f" | head -1 | cut -d: -f1 || true)
          if [ -n "$start" ]; then sed -n "${start},$((start+260))p" "$f"; fi
          echo '=== hydrology block around evap ==='
          line=$(grep -n 'evap=' "$f" | head -1 | cut -d: -f1 || true)
          if [ -n "$line" ]; then s=$((line-120)); [ $s -lt 1 ] && s=1; sed -n "${s},$((line+180))p" "$f"; fi
      - name: Remove transient workflow
        run: |
          rm -f .github/workflows/audit-biome4-vpd.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove transient BIOME4 atmospheric-demand audit'
          git push origin HEAD:agent/biome4-vpd-transpiration
