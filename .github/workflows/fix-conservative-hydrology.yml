name: Fix conservative hydrology closure field

on:
  push:
    branches:
      - agent/conservative-water-routing

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/conservative-water-routing
      - name: Fix closure field name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/sim/ConservativeHydrology.js')
          text = path.read_text()
          old = '''        routingClosureErrorM3,\n        relativeRoutingClosureError: localRunoffM3 > 0 ? routedClosureErrorM3 / localRunoffM3 : 0'''
          new = '''        routingClosureErrorM3: routedClosureErrorM3,\n        relativeRoutingClosureError: localRunoffM3 > 0 ? routedClosureErrorM3 / localRunoffM3 : 0'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one closure-field match, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit fix and remove helper workflow
        run: |
          rm .github/workflows/fix-conservative-hydrology.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix conservative hydrology routing closure field"
          git push origin HEAD:agent/conservative-water-routing
