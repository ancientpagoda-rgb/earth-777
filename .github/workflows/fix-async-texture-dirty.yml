name: Fix async texture retry
on:
  push:
    branches: [agent/performance-async-textures]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/performance-async-textures
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Add dirty retry state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/render/earth-view.js')
          s=p.read_text()
          s=s.replace('    this.textureBuildInFlight = false;\n','    this.textureBuildInFlight = false;\n    this.textureNeedsRefresh = false;\n',1)
          s=s.replace('    const now = performance.now();\n    if (!force && this.interacting) return;','    const now = performance.now();\n    if (force) this.textureNeedsRefresh = true;\n    if (!force && this.interacting) return;',1)
          s=s.replace('    if (!force && Math.abs(state.yearBP - this.lastTextureYear) < 2_500) return;','    if (!force && !this.textureNeedsRefresh && Math.abs(state.yearBP - this.lastTextureYear) < 2_500) return;',1)
          s=s.replace('      this.lastTextureYear = buildState.yearBP;\n      this.lastTextureRefreshMs = performance.now();','      this.lastTextureYear = buildState.yearBP;\n      this.lastTextureRefreshMs = performance.now();\n      this.textureNeedsRefresh = false;',1)
          p.write_text(s)
          PY
      - run: npm test
      - run: npm run build
      - name: Commit clean result
        run: |
          rm -f .github/workflows/fix-async-texture-dirty.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/render/earth-view.js .github/workflows/fix-async-texture-dirty.yml
          git commit -m "Retry cancelled scientific texture builds"
          git push origin HEAD:agent/performance-async-textures
