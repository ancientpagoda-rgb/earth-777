name: Print BIOME4 daily store block

on:
  push:
    branches:
      - agent/biome4-virtual-pft-hydrology

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-virtual-pft-hydrology
      - name: Print source block
        run: |
          curl -fsSL 'https://pmip2.lsce.ipsl.fr/share/synth/biome4/biome41.tar.gz' -o /tmp/b.tgz
          mkdir -p /tmp/b && tar -xzf /tmp/b.tgz -C /tmp/b
          f=$(find /tmp/b -name biome4.f | head -1)
          sed -n '2410,2465p' "$f"
      - name: Remove transient workflow
        run: |
          rm .github/workflows/audit-biome4-store-block.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove transient store-block audit'
          git push origin HEAD:agent/biome4-virtual-pft-hydrology
