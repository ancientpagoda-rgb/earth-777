name: Audit BIOME4 LAI search and respiration

on:
  push:
    branches:
      - agent/biome4-pft-lai-npp-optimization
    paths:
      - .github/workflows/audit-biome4-findnpp-respiration.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-pft-lai-npp-optimization
      - name: Print exact source ranges
        run: |
          curl -fsSL 'https://pmip2.lsce.ipsl.fr/share/synth/biome4/biome41.tar.gz' -o /tmp/b.tgz
          mkdir -p /tmp/b && tar -xzf /tmp/b.tgz -C /tmp/b
          f=$(find /tmp/b -name biome4.f | head -1)
          echo '=== findnpp 1210-1310 ==='
          sed -n '1210,1310p' "$f"
          echo '=== respiration 2100-2210 ==='
          sed -n '2100,2210p' "$f"
          echo '=== relevant parameter table 2630-2780 ==='
          sed -n '2630,2780p' "$f"
      - name: Remove transient workflow
        run: |
          rm -f .github/workflows/audit-biome4-findnpp-respiration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove transient BIOME4 LAI-search audit'
          git push origin HEAD:agent/biome4-pft-lai-npp-optimization
