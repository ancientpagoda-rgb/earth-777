name: Generate Krapp 777 ka climate

on:
  push:
    branches:
      - agent/krapp-777-climate

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/krapp-777-climate

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install netCDF4 numpy
      - run: python3 scripts/ingest-krapp-777.py

      - name: Validate generated scientific layer
        run: |
          python3 - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          asset = Path('public/data/krapp-777-climate.bin.gz')
          manifest = json.loads(Path('data/climate-manifest.json').read_text())
          raw = gzip.decompress(asset.read_bytes())
          expected = 3 * 12 * 360 * 720 * 2
          assert len(raw) == expected, (len(raw), expected)
          assert len(manifest['records']) == 36
          assert all(record['timeCoordinate'] == -777000.0 for record in manifest['records'])
          assert hashlib.sha256(asset.read_bytes()).hexdigest() == manifest['output']['assetSha256']
          print('compressed bytes', asset.stat().st_size)
          print('uncompressed bytes', len(raw))
          print('asset sha256', manifest['output']['assetSha256'])
          for variable in ('temperature', 'precipitation', 'cloudCover'):
              records=[r for r in manifest['records'] if r['variable']==variable]
              print(variable, 'min', min(r['stats']['minimum'] for r in records), 'max', max(r['stats']['maximum'] for r in records), 'missing', [r['stats']['missingCells'] for r in records])
          PY

      - name: Commit generated 777 ka climate layer
        run: |
          rm .github/workflows/generate-krapp-777.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/krapp-777-climate.bin.gz src/data/generated/krapp-777-meta.generated.js data/climate-manifest.json .github/workflows/generate-krapp-777.yml
          git commit -m "Generate published Krapp 777 ka monthly climate layer"
          git push origin HEAD:agent/krapp-777-climate
