name: Audit BIOME4 climate index details

on:
  push:
    branches:
      - agent/biome4-pft-climate-eligibility

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-pft-climate-eligibility
      - name: Inspect daily interpolation and minimum-temperature rule
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors 'https://pmip2.lsce.ipsl.fr/share/synth/biome4/biome41.tar.gz' -o /tmp/biome41.tar.gz
          mkdir -p /tmp/biome4 && tar -xzf /tmp/biome41.tar.gz -C /tmp/biome4
          python3 - <<'PY'
          from pathlib import Path
          p=next(Path('/tmp/biome4').rglob('biome4.f'))
          lines=p.read_text(errors='ignore').splitlines()
          for lo,hi in [(2818,2848),(3070,3150)]:
              print(f'--- lines {lo+1}-{hi} ---')
              for i in range(lo,min(hi,len(lines))): print(f'{i+1:5d}: {lines[i]}')
          PY
      - name: Remove transient workflow
        run: |
          rm .github/workflows/audit-biome4-climate-index-details.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove transient BIOME4 climate-index audit'
          git push origin HEAD:agent/biome4-pft-climate-eligibility
