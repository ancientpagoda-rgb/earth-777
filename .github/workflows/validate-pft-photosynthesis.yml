name: Validate BIOME4 PFT photosynthesis

on:
  push:
    branches:
      - agent/biome4-pft-hydrology-coupling

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-pft-hydrology-coupling
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate exact branch state
        run: |
          npm ci
          node --check src/sim/Biome4PftPhotosynthesis.js
          npm test
          npm run build
      - name: Remove transient validator
        run: |
          rm .github/workflows/validate-pft-photosynthesis.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove transient PFT photosynthesis validator'
          git push origin HEAD:agent/biome4-pft-hydrology-coupling
