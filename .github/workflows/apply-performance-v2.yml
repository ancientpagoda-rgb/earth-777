name: Apply Earth 777 performance isolation

on:
  push:
    branches:
      - agent/performance-interaction-isolation

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply performance isolation patch
        run: python3 .github/scripts/patch-performance-v2.py

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Benchmark global engine
        run: node --input-type=module -e "import { FreeEarthEngine } from './src/sim/free-earth.js'; const e=new FreeEarthEngine(777001); const t=performance.now(); for(let i=0;i<1000;i++) e.advance(10); console.log('1000 x 10-year advances ms=',(performance.now()-t).toFixed(2));"

      - name: Commit clean result
        run: |
          rm -f .github/scripts/patch-performance-v2.py .github/workflows/apply-performance-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/render/earth-view.js src/sim/regional-state.js .github
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Isolate interactive rendering from heavy science"
          git push origin HEAD:agent/performance-interaction-isolation
