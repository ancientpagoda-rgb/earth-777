name: Validate BIOME4 PFT water and phenology

on:
  push:
    branches:
      - agent/biome4-pft-water-phenology

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-pft-water-phenology
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Test and build exact branch state
        run: |
          npm ci
          npm test
          npm run build
      - name: Remove transient validator
        run: |
          rm .github/workflows/validate-pft-water-phenology.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove transient PFT water/phenology validator'
          git push origin HEAD:agent/biome4-pft-water-phenology
