name: Audit official BIOME4 source rules

on:
  push:
    branches:
      - agent/biome4-pft-transitions

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-pft-transitions
      - name: Download official PMIP BIOME4 source tarball
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors \
            'https://pmip2.lsce.ipsl.fr/share/synth/biome4/biome41.tar.gz' \
            -o /tmp/biome41.tar.gz
          echo '=== ARCHIVE SHA256 ==='
          sha256sum /tmp/biome41.tar.gz
          mkdir -p /tmp/biome4
          tar -xzf /tmp/biome41.tar.gz -C /tmp/biome4
          echo '=== SOURCE TREE ==='
          find /tmp/biome4 -maxdepth 3 -type f -printf '%P\n' | sort | head -200
      - name: Locate PFT parameters and biome classification rules
        run: |
          set -euo pipefail
          echo '=== LIKELY RULE/PARAMETER FILES ==='
          grep -RIlE 'PFT|pft|biome|BIOME|NPP|npp|LAI|lai' /tmp/biome4 \
            --include='*.f' --include='*.f90' --include='*.for' --include='*.F' --include='*.inc' --include='*.dat' --include='*.txt' \
            | sed 's#^/tmp/biome4/##' | sort | head -120
          echo '=== BIOME ASSIGNMENT HITS ==='
          grep -RniE 'biome[[:space:]]*=|ibiome|biomeno|biome_no|assign.*biome|class.*biome' /tmp/biome4 \
            --include='*.f' --include='*.f90' --include='*.for' --include='*.F' --include='*.inc' \
            | head -220 || true
          echo '=== PFT LIMIT / COMPETITION HITS ==='
          grep -RniE 'pft|gdd|tcold|tcm|npp|lai|domin|compet|success' /tmp/biome4 \
            --include='*.f' --include='*.f90' --include='*.for' --include='*.F' --include='*.inc' \
            | head -420 || true
      - name: Print compact candidate source excerpts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/biome4')
          terms=('biome','pft','gdd','lai','npp')
          candidates=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.f','.f90','.for','.inc','.txt','.dat'}:
                  continue
              try: text=p.read_text(errors='ignore')
              except Exception: continue
              score=sum(text.lower().count(t) for t in terms)
              if score: candidates.append((score,p,text))
          for score,p,text in sorted(candidates, reverse=True)[:8]:
              print(f'\n=== {p.relative_to(root)} score={score} ===')
              lines=text.splitlines()
              hit_indices=[i for i,line in enumerate(lines) if any(t in line.lower() for t in ('biome','pft','gdd','domin','npp','lai'))]
              shown=set()
              for i in hit_indices[:35]:
                  lo=max(0,i-3); hi=min(len(lines),i+7)
                  key=(lo,hi)
                  if key in shown: continue
                  shown.add(key)
                  for n in range(lo,hi): print(f'{n+1:5d}: {lines[n]}')
                  print('---')
          PY
      - name: Remove transient audit workflow
        run: |
          rm .github/workflows/audit-biome4-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove transient BIOME4 source audit workflow'
          git push origin HEAD:agent/biome4-pft-transitions
