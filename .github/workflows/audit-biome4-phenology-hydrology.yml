name: Audit BIOME4 phenology hydrology

on:
  push:
    branches:
      - agent/biome4-pft-lai-npp-optimization
    paths:
      - .github/workflows/audit-biome4-phenology-hydrology.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-pft-lai-npp-optimization
      - name: Print hydrology phenology and seasonal source ranges
        run: |
          curl -fsSL 'https://pmip2.lsce.ipsl.fr/share/synth/biome4/biome41.tar.gz' -o /tmp/b.tgz
          mkdir -p /tmp/b && tar -xzf /tmp/b.tgz -C /tmp/b
          f=$(find /tmp/b -name biome4.f | head -1)
          echo '=== hydrology phenology 2250-2405 ==='
          sed -n '2250,2405p' "$f"
          echo '=== seasonal phenology 2460-2630 ==='
          sed -n '2460,2630p' "$f"
      - name: Remove transient workflow
        run: |
          rm -f .github/workflows/audit-biome4-phenology-hydrology.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove transient BIOME4 phenology-hydrology audit'
          git push origin HEAD:agent/biome4-pft-lai-npp-optimization
