name: Audit BIOME4 lower-layer percolation

on:
  push:
    branches:
      - agent/biome4-vpd-transpiration
    paths:
      - .github/workflows/audit-biome4-k2.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-vpd-transpiration
      - run: |
          curl -fsSL 'https://pmip2.lsce.ipsl.fr/share/synth/biome4/biome41.tar.gz' -o /tmp/b.tgz
          mkdir -p /tmp/b && tar -xzf /tmp/b.tgz -C /tmp/b
          f=$(find /tmp/b -name biome4.f | head -1)
          echo '=== k(1..6) assignments/uses ==='
          grep -n -E 'k\([1-6]\)' "$f" | head -260
          echo '=== water call sites ==='
          grep -n -C 8 -E 'call +water|subroutine +water' "$f" | head -220
      - name: Remove transient workflow
        run: |
          rm -f .github/workflows/audit-biome4-k2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove transient BIOME4 lower-percolation audit'
          git push origin HEAD:agent/biome4-vpd-transpiration
