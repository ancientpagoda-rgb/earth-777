name: Audit BIOME4 soil sentinel and scaling rules

on:
  push:
    branches:
      - agent/biome4-pft-transitions

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-pft-transitions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install netCDF4 numpy
      - name: Inspect exact BIOME4 soil handling and value populations
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors \
            'https://pmip2.lsce.ipsl.fr/share/synth/biome4/biome41.tar.gz' \
            -o /tmp/biome41.tar.gz
          mkdir -p /tmp/biome4
          tar -xzf /tmp/biome41.tar.gz -C /tmp/biome4
          python3 - <<'PY'
          import netCDF4 as nc, numpy as np
          ds=nc.Dataset('/tmp/biome4/inputdata.nc')
          for name in ('whc','perc'):
              var=ds.variables[name]
              a=np.ma.asarray(var[:],dtype=float)
              raw=np.asarray(np.ma.filled(a,np.nan),dtype=float)
              print(f'\n=== {name} ===')
              print('units',getattr(var,'units',''), 'missing',getattr(var,'missing_value',None))
              for layer in range(2):
                  x=raw[layer].ravel()
                  finite=x[np.isfinite(x)]
                  vals,counts=np.unique(finite,return_counts=True)
                  pairs=sorted(zip(counts,vals),reverse=True)
                  print('layer',layer+1,'top values by frequency:')
                  for count,val in pairs[:35]: print(int(count),float(val))
                  flags={v:int(np.count_nonzero(np.isclose(finite,v))) for v in (-9999.,-4.,-1.,999.,999.9)}
                  physical=finite[(finite>=0)&(finite<900)]
                  print('flags',flags)
                  print('physical-range stats min max median mean count',
                        float(physical.min()) if physical.size else None,
                        float(physical.max()) if physical.size else None,
                        float(np.median(physical)) if physical.size else None,
                        float(physical.mean()) if physical.size else None,
                        int(physical.size))
                  if physical.size:
                      q=np.quantile(physical,[0,.01,.05,.25,.5,.75,.95,.99,1])
                      print('quantiles',q.tolist())
          PY
      - name: Remove transient workflow
        if: always()
        run: |
          rm -f .github/workflows/audit-biome4-soil-rules.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove transient BIOME4 soil rules audit'
            git push origin HEAD:agent/biome4-pft-transitions
          fi
