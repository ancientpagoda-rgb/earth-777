name: Audit BIOME4 PET tail and lookup table

on:
  push:
    branches:
      - agent/biome4-virtual-pft-hydrology

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-virtual-pft-hydrology
      - name: Print PET tail and table routine
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors 'https://pmip2.lsce.ipsl.fr/share/synth/biome4/biome41.tar.gz' -o /tmp/biome41.tar.gz
          mkdir -p /tmp/biome4 && tar -xzf /tmp/biome41.tar.gz -C /tmp/biome4
          python3 - <<'PY'
          from pathlib import Path
          p=next(Path('/tmp/biome4').rglob('biome4.f'))
          lines=p.read_text(errors='ignore').splitlines()
          for lo,hi,label in [(3030,3115,'ppeett tail'),(3110,3205,'table/adjacent routines'),(2840,2942,'snow/precip forcing')]:
              print(f'\n=== {label}: lines {lo+1}-{hi} ===')
              for n in range(lo,min(hi,len(lines))): print(f'{n+1:5d}: {lines[n]}')
          PY
      - name: Remove transient workflow
        run: |
          rm .github/workflows/audit-biome4-pet-tail-table.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove transient PET tail/table audit'
          git push origin HEAD:agent/biome4-virtual-pft-hydrology
