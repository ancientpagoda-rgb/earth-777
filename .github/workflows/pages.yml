name: Deploy Earth 777 to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        shell: bash
        run: |
          set +e
          node --test test/free-earth.test.js test/simplified-ui.test.js 2>&1 | tee earth-777-unit-tests.log
          TEST_STATUS=${PIPESTATUS[0]}
          set -e
          exit "$TEST_STATUS"

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earth-777-unit-tests-${{ github.run_id }}
          path: earth-777-unit-tests.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Build for GitHub Pages
        run: npm run build -- --base=/earth-777/

      - name: Enforce startup bundle budget
        continue-on-error: true
        run: npm run check:bundle

      - name: Browser smoke and interaction playtest
        shell: bash
        run: |
          PREVIEW_PID=""
          CHROME_PID=""
          cleanup() {
            if [ -n "$CHROME_PID" ]; then kill "$CHROME_PID" 2>/dev/null || true; fi
            if [ -n "$PREVIEW_PID" ]; then kill "$PREVIEW_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          npx vite preview --host 127.0.0.1 --base=/earth-777/ > /tmp/earth-777-preview.log 2>&1 &
          PREVIEW_PID=$!

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/earth-777/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/earth-777-preview.log
              exit 1
            fi
            sleep 1
          done

          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-unsafe-swiftshader \
            --use-angle=swiftshader \
            --remote-debugging-port=9222 \
            --remote-debugging-address=127.0.0.1 \
            --user-data-dir=/tmp/earth-777-chrome \
            http://127.0.0.1:4173/earth-777/ \
            > /tmp/earth-777-chrome.log 2>&1 &
          CHROME_PID=$!

          WS_ENDPOINT=""
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:9222/json/list > /tmp/earth-777-cdp-pages.json; then
              WS_ENDPOINT=$(node -e '
                const fs = require("node:fs");
                const pages = JSON.parse(fs.readFileSync("/tmp/earth-777-cdp-pages.json", "utf8"));
                const page = pages.find((entry) => entry.type === "page" && entry.url.includes("earth-777"));
                process.stdout.write(page?.webSocketDebuggerUrl ?? "");
              ')
            fi
            if [ -n "$WS_ENDPOINT" ]; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/earth-777-preview.log
              cat /tmp/earth-777-chrome.log
              exit 1
            fi
            sleep 1
          done

          if ! node test/cdp-smoke.mjs "$WS_ENDPOINT"; then
            cat /tmp/earth-777-preview.log
            cat /tmp/earth-777-chrome.log
            exit 1
          fi

          set +e
          node test/cdp-playtest.mjs "$WS_ENDPOINT" 2>&1 | tee earth-777-playtest.log
          PLAYTEST_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$PLAYTEST_STATUS" -ne 0 ]; then
            cat /tmp/earth-777-preview.log
            cat /tmp/earth-777-chrome.log
            exit "$PLAYTEST_STATUS"
          fi

          set +e
          node test/cdp-lite-smoke.mjs "$WS_ENDPOINT" 2>&1 | tee -a earth-777-playtest.log
          LITE_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$LITE_STATUS" -ne 0 ]; then
            cat /tmp/earth-777-preview.log
            cat /tmp/earth-777-chrome.log
            exit "$LITE_STATUS"
          fi

      - name: Upload interaction playtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earth-777-playtest-${{ github.run_id }}
          path: earth-777-playtest.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
