name: Finalize PFT water and phenology

on:
  push:
    branches:
      - agent/biome4-pft-water-phenology

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-pft-water-phenology
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply selected-region integration and scientific status updates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text(); found=s.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {found}: {old[:140]!r}')
              p.write_text(s.replace(old,new,count))

          # CWF-friendly PFT diagnostics cache: keep the lightweight vegetation
          # cache exact, but quantize the expensive 365-day inspector solve.
          replace('src/sim/SpatialVegetation.js',
              '  _prepare(globalState, spatialDetail) {\n    const signature = this._signature(globalState, spatialDetail);\n    if (signature !== this.cacheSignature) {\n      this.cache.clear();\n      this.pftDiagnosticCache.clear();\n      this.cacheSignature = signature;\n    }\n  }\n',
              '  _pftDiagnosticSignature(globalState, spatialDetail) {\n    return [\n      round(globalState.temperatureAnomaly ?? 0, 1),\n      round(globalState.iceIndex ?? 0, 2),\n      round(globalState.co2 ?? CHECKPOINT_777.boundary.co2.value, 0),\n      round(spatialDetail, 1)\n    ].join("|");\n  }\n\n  _prepare(globalState, spatialDetail) {\n    const signature = this._signature(globalState, spatialDetail);\n    if (signature !== this.cacheSignature) {\n      this.cache.clear();\n      this.cacheSignature = signature;\n    }\n  }\n')
          replace('src/sim/SpatialVegetation.js',
              '    const key = `${annual.latitude}:${annual.longitude}:${annual.gridSpacingDegrees}`;\n    if (this.pftDiagnosticCache.has(key)) return this.pftDiagnosticCache.get(key);\n',
              '    const key = `${this._pftDiagnosticSignature(globalState, detail)}|${annual.latitude}:${annual.longitude}:${annual.gridSpacingDegrees}`;\n    if (this.pftDiagnosticCache.has(key)) return this.pftDiagnosticCache.get(key);\n')
          replace('src/sim/SpatialVegetation.js',
              '      this.pftDiagnosticCache.set(key, unresolved);\n      return unresolved;\n',
              '      this.pftDiagnosticCache.set(key, unresolved);\n      if (this.pftDiagnosticCache.size > 24) this.pftDiagnosticCache.delete(this.pftDiagnosticCache.keys().next().value);\n      return unresolved;\n')
          replace('src/sim/SpatialVegetation.js',
              '    this.pftDiagnosticCache.set(key, result);\n    return result;\n  }\n\n  monthlyAt',
              '    this.pftDiagnosticCache.set(key, result);\n    if (this.pftDiagnosticCache.size > 24) this.pftDiagnosticCache.delete(this.pftDiagnosticCache.keys().next().value);\n    return result;\n  }\n\n  monthlyAt')

          # Only selected-region inspection asks for the expensive daily PFT solve.
          replace('src/sim/regional-state.js',
              '  const vegetationState = vegetation?.sample?.(globalState, latitude, longitude, spatialDetail) ?? null;\n  const fallbackBiome',
              '  const vegetationState = vegetation?.sample?.(globalState, latitude, longitude, spatialDetail) ?? null;\n  const pftWaterPhenology = vegetation?.pftDiagnostics?.(globalState, latitude, longitude, spatialDetail) ?? null;\n  const fallbackBiome')
          replace('src/sim/regional-state.js',
              '    pftEligibilityPolicy: vegetationState?.pftEligibilityPolicy ?? null,\n    vegetationSource:',
              '    pftEligibilityPolicy: vegetationState?.pftEligibilityPolicy ?? null,\n    pftWaterPhenology: pftWaterPhenology ? Object.freeze({\n      status: pftWaterPhenology.status,\n      candidateCount: pftWaterPhenology.candidateCount,\n      resolvedCount: pftWaterPhenology.resolvedCount,\n      candidatePftIds: pftWaterPhenology.candidatePftIds,\n      raingreenDiscrepancyPftIds: pftWaterPhenology.raingreenDiscrepancyPftIds,\n      hydrologyFeedbackEnabled: pftWaterPhenology.hydrologyFeedbackEnabled,\n      candidates: Object.freeze((pftWaterPhenology.candidates ?? []).map((candidate) => Object.freeze({\n        pftId: candidate.pftId,\n        pftCode: candidate.pftCode,\n        pftName: candidate.pftName,\n        climateEligibilityStatus: candidate.climateEligibilityStatus,\n        greenDays: candidate.greenDays,\n        meanLeafFraction: candidate.meanLeafFraction,\n        meanRootZoneWetness: candidate.meanRootZoneWetness,\n        meanWaterSupplyCapacityMmPerDay: candidate.meanWaterSupplyCapacityMmPerDay,\n        raingreenThresholdDiscrepancy: candidate.raingreenThresholdDiscrepancy\n      }))),\n      epistemicStatus: pftWaterPhenology.epistemicStatus\n    }) : null,\n    vegetationSource:')
          replace('src/sim/regional-state.js',
              '; vegetation uses the published 777 ka BIOME4 category/NPP/LAI baseline with continuous hydro-CO₂ response and an independently implemented BIOME4 climate-eligibility sieve; categorical transitions remain disabled',
              '; vegetation uses the published 777 ka BIOME4 category/NPP/LAI baseline with continuous hydro-CO₂ response, an independently implemented BIOME4 climate-eligibility sieve, and opt-in source-operational daily rooting/water/phenology diagnostics; those diagnostics do not feed back into hydrology and categorical transitions remain disabled')

          replace('src/main.js',
              '  if (Array.isArray(region.climateUnresolvedPftIds) && region.climateUnresolvedPftIds.length) {\n    climateDetails.push(`PFT unresolved ${region.climateUnresolvedPftIds.join("/")} · snow physics pending`);\n  }\n',
              '  if (Array.isArray(region.climateUnresolvedPftIds) && region.climateUnresolvedPftIds.length) {\n    climateDetails.push(`PFT unresolved ${region.climateUnresolvedPftIds.join("/")} · snow physics pending`);\n  }\n  if (region.pftWaterPhenology?.status === "resolved") {\n    climateDetails.push(`PFT daily phenology ${region.pftWaterPhenology.resolvedCount}/${region.pftWaterPhenology.candidateCount}`);\n    if (region.pftWaterPhenology.raingreenDiscrepancyPftIds?.length) {\n      climateDetails.push(`BIOME4 rain-threshold source quirk preserved for PFT ${region.pftWaterPhenology.raingreenDiscrepancyPftIds.join("/")}`);\n    }\n  } else if (region.pftWaterPhenology?.status === "unresolved-water-trace") {\n    climateDetails.push("PFT daily water/phenology unresolved at this soil cell");\n  }\n')

          replace('src/data/checkpoint-777.js',
              '    vegetation: Object.freeze({ status: "published Krapp BIOME4 777 ka biome/NPP/LAI checkpoint + model-derived hydro-CO₂ response + independently implemented BIOME4 4.1 PFT climate eligibility", target: "rooting/phenology, optimized PFT LAI/NPP, snow/fire/dryness diagnostics, competition and categorical biome transitions", sources: ["krapp-2021", "biome4-4.1-soil"] }),',
              '    vegetation: Object.freeze({ status: "published Krapp BIOME4 777 ka biome/NPP/LAI checkpoint + model-derived hydro-CO₂ response + independent BIOME4 4.1 PFT climate eligibility and daily rooting/water/phenology diagnostics", target: "PFT-specific hydrology feedback, optimized PFT LAI/NPP, snow/fire/dryness diagnostics, competition and categorical biome transitions", sources: ["krapp-2021", "biome4-4.1-soil"] }),')

          replace('src/data/provenance.js',
              '    role: "Static 0.5° two-layer water-holding-capacity and percolation inputs plus factual BIOME4 4.1 PFT parameter/constraint semantics. Earth 777 preserves the source soil floats and implements the climate-eligibility sieve independently rather than copying BIOME4 program structure.",\n    status: "integrated · 0.5° soil driver + PFT climate-eligibility parameter reference"',
              '    role: "Static 0.5° two-layer water-holding-capacity and percolation inputs plus factual BIOME4 4.1 PFT climate, rooting, transpiration and phenology parameter semantics. Earth 777 preserves source soil floats and independently implements the climate sieve plus selected-region daily rooting/water/phenology diagnostics rather than copying BIOME4 program structure.",\n    status: "integrated · 0.5° soil driver + PFT climate/rooting/phenology parameter reference"')

          replace('README.md',
              '- an independently implemented BIOME4 4.1 PFT climate-eligibility sieve for all 13 PFT parameter records, using the source coldest/warmest-month, absolute-minimum and GDD constraints while leaving the snow-dependent tundra-shrub gate unresolved until snowpack exists;\n',
              '- an independently implemented BIOME4 4.1 PFT climate-eligibility sieve for all 13 PFT parameter records, using the source coldest/warmest-month, absolute-minimum and GDD constraints while leaving the snow-dependent tundra-shrub gate unresolved until snowpack exists;\n- opt-in selected-region BIOME4 PFT rooting, daily water-supply and source-operational phenology diagnostics over the conserved two-layer soil trace, without yet feeding PFT-specific transpiration back into hydrology;\n')
          replace('README.md',
              'Climate eligibility is only a candidate sieve: optimized PFT LAI/NPP, rooting/phenology, fire/dryness diagnostics, woody/grass competition and the empirical biome classifier are still required before Earth 777 may change categorical biome.',
              'Climate eligibility is only a candidate sieve. Selected regions now also evaluate BIOME4 root-weighted two-layer wetness, maximum daily water-supply capacity and source-operational evergreen/summergreen/raingreen phenology from the conserved 365-day soil trace. Two source quirks are preserved and documented rather than silently corrected: BIOME4 4.1 assigns parameter 4 to both raingreen leaf-off and leaf-on thresholds despite documenting parameter 5 as leaf-on, and its summergreen canopy ramp gates accumulation by 0/5 °C but then adds the full positive daily temperature rather than temperature above the threshold. These PFT diagnostics do not yet change evapotranspiration or soil water, optimize PFT LAI/NPP, simulate snow/fire/dryness, perform woody/grass competition, or run the empirical biome classifier; categorical biome therefore remains the published checkpoint category.')
          replace('README.md',
              '5. **Integrated prerequisite:** independent BIOME4 4.1 PFT climate eligibility. Next implement rooting/phenology and water use, optimized PFT LAI/NPP, snow/fire/dryness diagnostics, competition and classification before enabling categorical biome transitions.',
              '5. **Integrated prerequisites:** independent BIOME4 4.1 PFT climate eligibility plus selected-region rooting/water-supply/phenology diagnostics. Next couple PFT-specific water demand back into the conserved hydrology, then implement optimized PFT LAI/NPP, snow/fire/dryness diagnostics, competition and classification before enabling categorical biome transitions.')
          PY
      - name: Validate exact final branch state
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit validated integration and remove helper
        run: |
          rm .github/workflows/finalize-pft-water-phenology.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate BIOME4 PFT daily water and phenology diagnostics'
          git push origin HEAD:agent/biome4-pft-water-phenology
