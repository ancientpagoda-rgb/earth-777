name: Audit BIOME4 pressure input

on:
  push:
    branches:
      - agent/biome4-virtual-pft-hydrology

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-virtual-pft-hydrology
      - name: Trace pressure variable assignment
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors 'https://pmip2.lsce.ipsl.fr/share/synth/biome4/biome41.tar.gz' -o /tmp/biome41.tar.gz
          mkdir -p /tmp/biome4 && tar -xzf /tmp/biome41.tar.gz -C /tmp/biome4
          python3 - <<'PY'
          from pathlib import Path
          p=next(Path('/tmp/biome4').rglob('biome4.f'))
          lines=p.read_text(errors='ignore').splitlines()
          hits=[]
          for i,line in enumerate(lines):
              text=line.lower().replace(' ','')
              if ('p=' in text or '=p' in text or 'press' in text or 'elev' in text or 'alt' in text) and not line.lstrip().lower().startswith('c'):
                  hits.append(i)
          for i in hits:
              lo=max(0,i-8); hi=min(len(lines),i+9)
              print(f'\n--- around line {i+1} ---')
              for n in range(lo,hi): print(f'{n+1:5d}: {lines[n]}')
          PY
      - name: Remove transient workflow
        run: |
          rm .github/workflows/audit-biome4-pressure-input.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove transient BIOME4 pressure audit'
          git push origin HEAD:agent/biome4-virtual-pft-hydrology
