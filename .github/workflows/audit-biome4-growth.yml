name: Audit BIOME4 growth optimization

on:
  push:
    branches:
      - agent/biome4-pft-lai-npp-optimization
    paths:
      - .github/workflows/audit-biome4-growth.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-pft-lai-npp-optimization
      - name: Inspect BIOME4 growth and optimization source
        run: |
          curl -fsSL 'https://pmip2.lsce.ipsl.fr/share/synth/biome4/biome41.tar.gz' -o /tmp/b.tgz
          mkdir -p /tmp/b && tar -xzf /tmp/b.tgz -C /tmp/b
          f=$(find /tmp/b -name biome4.f | head -1)
          echo '=== growth symbols ==='
          grep -n -E 'subroutine +growth|maxlai|optlai|npp|anpp|lresp|rresp|sresp|leaf|root|wood|resp|aday|photsyn|gpp' "$f" | head -420
          echo '=== growth routine ==='
          start=$(grep -n -i 'subroutine  *growth' "$f" | head -1 | cut -d: -f1 || true)
          if [ -n "$start" ]; then sed -n "${start},$((start+700))p" "$f"; fi
      - name: Remove transient workflow
        run: |
          rm -f .github/workflows/audit-biome4-growth.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove transient BIOME4 growth audit'
          git push origin HEAD:agent/biome4-pft-lai-npp-optimization
