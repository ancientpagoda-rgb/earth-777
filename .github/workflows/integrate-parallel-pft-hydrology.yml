name: Integrate parallel PFT hydrology trials

on:
  push:
    branches:
      - agent/biome4-parallel-pft-hydrology
    paths:
      - scripts/integrate-parallel-pft-hydrology.py
      - .github/workflows/integrate-parallel-pft-hydrology.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-parallel-pft-hydrology
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 scripts/integrate-parallel-pft-hydrology.py
      - run: npm test
      - run: npm run build
      - name: Commit integration and remove one-time helpers
        run: |
          rm -f .github/workflows/integrate-parallel-pft-hydrology.yml
          rm -f scripts/integrate-parallel-pft-hydrology.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate parallel mass-conserving PFT water trials'
          git push origin HEAD:agent/biome4-parallel-pft-hydrology
