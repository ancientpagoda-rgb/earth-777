name: Integrate Krapp 777 ka climate runtime

on:
  push:
    branches:
      - agent/krapp-777-climate

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/krapp-777-climate

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: python3 scripts/apply-krapp-runtime-patch.py
      - run: npm test
      - run: npm run build

      - name: Commit runtime integration
        run: |
          rm .github/workflows/integrate-krapp-runtime.yml scripts/apply-krapp-runtime-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use published Krapp climate at the 777 ka checkpoint"
          git push origin HEAD:agent/krapp-777-climate
