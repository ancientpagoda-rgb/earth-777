name: Generate ETOPO 2022 compact terrain

on:
  push:
    branches:
      - agent/etopo-2022-terrain

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etopo-2022-terrain

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run data:terrain
      - name: Validate generated terrain module
        run: |
          node --input-type=module - <<'NODE'
          const terrain = await import('./src/data/generated/etopo-2022.generated.js');
          const samples = [
            terrain.bedrockElevationAt(27.99, 86.93),
            terrain.bedrockElevationAt(0, -30),
            terrain.bedrockElevationAt(-75, 0)
          ];
          if (samples.some((value) => !Number.isFinite(value))) throw new Error('Non-finite ETOPO sample');
          if (terrain.ETOPO_2022_META.rows !== 360 || terrain.ETOPO_2022_META.cols !== 720) {
            throw new Error('Unexpected compact ETOPO dimensions');
          }
          console.log(terrain.ETOPO_2022_META);
          console.log('sample elevations', samples);
          NODE

      - name: Commit generated scientific layer
        run: |
          rm .github/workflows/generate-etopo-terrain.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/etopo-2022.generated.js data/terrain-manifest.json .github/workflows/generate-etopo-terrain.yml
          git commit -m "Generate compact ETOPO 2022 bedrock layer"
          git push origin HEAD:agent/etopo-2022-terrain
