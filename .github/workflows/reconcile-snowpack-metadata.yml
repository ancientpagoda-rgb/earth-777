name: Reconcile snowpack metadata

on:
  push:
    branches:
      - agent/snowpack-melt-v2

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/snowpack-melt-v2
      - run: python3 scripts/patch-snowpack-metadata.py
      - name: Commit reconciled metadata and remove helpers
        run: |
          rm .github/workflows/reconcile-snowpack-metadata.yml
          rm scripts/patch-snowpack-metadata.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile snowpack metadata with BIOME4 main"
          git push origin HEAD:agent/snowpack-melt-v2
