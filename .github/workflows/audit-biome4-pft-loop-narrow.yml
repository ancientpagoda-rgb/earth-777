name: Narrow audit BIOME4 PFT hydrology loop

on:
  push:
    branches:
      - agent/biome4-pft-hydrology-coupling

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome4-pft-hydrology-coupling
      - name: Print exact PFT evaluation and competition sections
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors 'https://pmip2.lsce.ipsl.fr/share/synth/biome4/biome41.tar.gz' -o /tmp/biome41.tar.gz
          mkdir -p /tmp/biome4 && tar -xzf /tmp/biome41.tar.gz -C /tmp/biome4
          python3 - <<'PY'
          from pathlib import Path
          p=next(Path('/tmp/biome4').rglob('biome4.f'))
          lines=p.read_text(errors='ignore').splitlines()
          targets=[]
          for i,line in enumerate(lines):
              low=' '.join(line.lower().split())
              if ('do 5000' in low or 'call hydrology' in low or 'call nppcalc' in low or
                  'optlai(' in low or 'maxnpp(' in low or 'optnpp(' in low or
                  'biome=' in low or 'biome =' in low):
                  targets.append(i)
          print('TARGETS', [i+1 for i in targets])
          # Emit narrow neighborhoods around the first main-PFT-loop hits and
          # later classification/competition hits, merging overlaps.
          ranges=[]
          for i in targets:
              lo=max(0,i-45); hi=min(len(lines),i+70)
              if ranges and lo <= ranges[-1][1]+1:
                  ranges[-1]=(ranges[-1][0],max(ranges[-1][1],hi))
              else:
                  ranges.append((lo,hi))
          for lo,hi in ranges:
              print(f'\n=== lines {lo+1}-{hi} ===')
              for n in range(lo,hi): print(f'{n+1:5d}: {lines[n]}')
          PY
      - name: Remove transient workflow
        run: |
          rm .github/workflows/audit-biome4-pft-loop-narrow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove transient narrow PFT loop audit'
          git push origin HEAD:agent/biome4-pft-hydrology-coupling
